name: Weekly Version Bump

# GitHub disables scheduled workflows after 60 days with no repo commits.
# This pushes a small version bump every week so the daily puzzle cron stays enabled.

on:
  schedule:
    - cron: "0 0 * * 0"   # Sunday 00:00 UTC = Saturday 6 PM CST (7 PM CDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump version
        run: |
          current=$(cat VERSION 2>/dev/null || echo "1.0.0")
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          echo "$next" > VERSION
          echo "NEXT=$next" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Weekly version bump to v$NEXT"
          git push
