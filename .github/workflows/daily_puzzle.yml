name: Generate Daily Puzzle

on:
  schedule:
    - cron: "0 5 * * *"   # 5 AM UTC — primary
    - cron: "0 6 * * *"   # 6 AM UTC — backup in case 5 AM run was dropped
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run puzzle generator
        env:
          TMDB_API_KEY:          ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python puzzle_generator.py

      - name: Text me if puzzle generation failed
        if: failure()
        env:
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY:  ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          curl -s \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=CineClue: puzzle generation failed" \
            --form-string "message=daily_puzzle.yml failed — a puzzle could not be created even after loosening every filter tier (or the script crashed). Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://api.pushover.net/1/messages.json
